<!DOCTYPE html>
<html lang="de">
<head>
    <!--
    LOCAL (Lokale Offline Chat Anwendungs-Logik)
    Zero-Dependency In-Browser KI-Client für Chrome Built-in AI (Gemini Nano)
    
    VORAUSSETZUNGEN (Google Chrome Prompt API):
    1. chrome://flags/#prompt-api-for-gemini-nano (Enabled)
    2. chrome://flags/#optimization-guide-on-device-model (Enabled BypassPerfRequirement)
    3. Browser danach vollständig neu starten.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCAL – Lokale Offline Chat Anwendungs-Logik (Gemini Nano)</title>
    <style>
        /* === Basis & Layout === */
        :root {
            --bg-primary: #121212;
            --bg-secondary: #181818;
            --bg-surface: #1e1e1e;
            --bg-input: #2c2c2c;
            --accent-primary: #1a73e8;
            --accent-hover: #1557b0;
            --accent-warning: #fbc02d;
            --accent-danger: #d32f2f;
            --accent-success: #4caf50;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #app-layout { display: flex; width: 100%; height: 100%; }

        /* === Debug Terminal === */
        #debug-terminal {
            position: absolute; top: 0; left: 0; width: 100%; height: 45%;
            background: rgba(10, 10, 10, 0.96); color: #00ff66;
            font-family: 'Consolas', 'Menlo', monospace; z-index: 10000;
            display: none; flex-direction: column; border-bottom: 2px solid #444;
            backdrop-filter: blur(4px);
        }
        #debug-terminal-header {
            padding: 8px 15px; background: #1c1c1c; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; font-weight: bold; color: #fff; font-size: 0.9em;
        }
        #debug-log {
            flex-grow: 1; overflow-y: auto; padding: 10px; font-size: 0.85em;
            display: flex; flex-direction: column; gap: 4px; line-height: 1.4;
        }
        .log-error { color: #ff5252; }
        .log-warn { color: #fbc02d; }
        .log-info { color: #69f0ae; }

        /* === Sidebar (Multi-Session) === */
        #sidebar {
            width: 270px; background: var(--bg-secondary); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0; z-index: 10;
        }
        #sidebar.hidden { margin-left: -270px; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); }
        .new-chat-full-btn {
            width: 100%; padding: 10px; background: var(--accent-primary); color: white;
            border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 0.95em; transition: background 0.2s;
        }
        .new-chat-full-btn:hover { background: var(--accent-hover); }
        #session-list { flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .session-item {
            padding: 10px 12px; background: #222; border-radius: 6px; cursor: pointer;
            font-size: 0.9em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border: 1px solid transparent; transition: 0.15s; display: flex; justify-content: space-between; align-items: center;
        }
        .session-item:hover { background: #2a2a2a; border-color: #444; }
        .session-item.active { background: #1a2f4d; border-color: var(--accent-primary); color: #fff; }
        .session-item-title { overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin-right: 6px; }
        .session-item-delete {
            color: #ff5252; background: none; border: none; cursor: pointer;
            display: none; padding: 2px 6px; font-size: 0.9em; border-radius: 3px;
        }
        .session-item:hover .session-item-delete { display: inline-block; }
        .session-item-delete:hover { background: rgba(255, 82, 82, 0.2); }

        /* === Haupt-Chatbereich === */
        #chat-container {
            flex-grow: 1; display: flex; flex-direction: column; position: relative;
            background: var(--bg-surface); min-width: 0;
        }
        #drag-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 115, 232, 0.88); color: white; font-size: 1.8em; font-weight: bold;
            display: none; justify-content: center; align-items: center;
            z-index: 9999; border: 4px dashed #fff; box-sizing: border-box; backdrop-filter: blur(2px);
        }
        
        /* === Header & Context Bar === */
        #chat-header {
            background-color: #191919; color: white; padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .header-title-area { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 1.05em; }
        .header-status-badge {
            font-size: 0.75em; padding: 2px 8px; border-radius: 12px;
            font-weight: normal; background: #333; color: #aaa; display: inline-flex; align-items: center; gap: 4px;
        }
        .header-status-badge.status-ok { background: rgba(76, 175, 80, 0.2); color: #81c784; }
        .header-status-badge.status-warn { background: rgba(251, 192, 45, 0.2); color: #fff59d; }
        .header-status-badge.status-err { background: rgba(244, 67, 54, 0.2); color: #e57373; }

        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: #252525; border: 1px solid #444; color: white;
            border-radius: 5px; padding: 6px 10px; cursor: pointer;
            font-size: 0.85em; transition: 0.15s; display: flex; align-items: center; gap: 6px;
        }
        .icon-btn:hover { background: #333; border-color: #666; }
        
        #context-bar-container {
            width: 100%; height: 5px; background: #262626; position: relative; cursor: help;
        }
        #context-bar-fill {
            width: 0%; height: 100%; background: var(--accent-success);
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        
        #compress-btn {
            background: var(--accent-warning); color: #000; font-weight: 600; border: none;
            padding: 6px 14px; cursor: pointer; font-size: 0.8em; display: none;
            justify-content: center; align-items: center; transition: 0.2s;
            border-radius: 0 0 6px 6px; margin: 0 auto; width: max-content;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        #compress-btn:hover { background: #f9a825; }

        /* === Settings Panel === */
        #settings-panel {
            background: #1f1f1f; padding: 14px 18px; border-bottom: 1px solid var(--border-color);
            display: none; flex-direction: column; gap: 10px;
        }
        .settings-field { display: flex; flex-direction: column; gap: 4px; }
        .settings-label { font-size: 0.85em; color: #bbb; font-weight: 600; }
        #system-prompt {
            width: 100%; padding: 8px 10px; background-color: var(--bg-surface);
            color: var(--text-main); border: 1px solid #444; border-radius: 5px;
            outline: none; font-family: inherit; font-size: 0.9em; resize: vertical; min-height: 48px;
        }
        .settings-row { display: flex; align-items: center; gap: 12px; font-size: 0.85em; flex-wrap: wrap; }
        .settings-row input[type="text"] {
            background: var(--bg-surface); border: 1px solid #444; color: #fff;
            padding: 4px 8px; border-radius: 4px; font-size: 0.9em; flex-grow: 1; min-width: 200px;
        }

        /* === Chat Verlauf === */
        #chat-box { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 88%; position: relative; }
        .wrapper-user { align-self: flex-end; align-items: flex-end; }
        .wrapper-ai { align-self: flex-start; align-items: flex-start; }
        .message { padding: 12px 16px; border-radius: 14px; line-height: 1.55; word-wrap: break-word; width: 100%; }
        .user-msg { background-color: var(--accent-primary); color: #ffffff; border-bottom-right-radius: 2px; white-space: pre-wrap; font-size: 0.98em; }
        .ai-msg { background-color: #2b2b2b; color: var(--text-main); border-bottom-left-radius: 2px; font-size: 0.98em; }
        
        .edit-area {
            width: 100%; box-sizing: border-box; padding: 10px; background: #222; color: #fff;
            border: 1px solid var(--accent-primary); border-radius: 6px; resize: vertical;
            font-family: inherit; margin-bottom: 8px; font-size: 0.95em;
        }
        .save-edit-btn { background: var(--accent-success); color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .cancel-edit-btn { background: #555; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-left: 8px; }
        
        /* === Markdown & Syntax Styling === */
        .ai-msg strong { color: #fff; font-weight: 600; }
        .ai-msg em { color: #ddd; font-style: italic; }
        .ai-msg p { margin: 0 0 10px 0; }
        .ai-msg p:last-child { margin: 0; }
        .ai-msg h1, .ai-msg h2, .ai-msg h3 { margin: 12px 0 6px 0; color: #fff; }
        .ai-msg h1 { font-size: 1.3em; }
        .ai-msg h2 { font-size: 1.15em; }
        .ai-msg h3 { font-size: 1.05em; }
        .ai-msg ul, .ai-msg ol { margin: 6px 0 10px 20px; padding: 0; }
        .ai-msg li { margin-bottom: 4px; }
        .ai-msg blockquote {
            border-left: 3px solid var(--accent-primary); margin: 8px 0;
            padding: 4px 12px; color: #bbb; background: rgba(255,255,255,0.02);
        }

        .code-wrap { background: #101010; border-radius: 6px; border: 1px solid #3c3c3c; margin: 12px 0; overflow: hidden; width: 100%; }
        .code-header {
            background: #1c1c1c; padding: 6px 12px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #333; font-size: 0.8em; color: #aaa;
        }
        .code-actions { display: flex; gap: 8px; }
        .code-wrap pre { margin: 0; padding: 12px; overflow-x: auto; }
        .code-wrap code, .inline-code { color: #f0f0f0; font-family: 'Consolas', 'Fira Code', 'Menlo', monospace; font-size: 0.9em; }
        .inline-code { background: #181818; padding: 2px 5px; border-radius: 3px; border: 1px solid #383838; color: #ffb74d; }
        
        .hl-keyword { color: #c678dd; font-weight: 600; }
        .hl-string { color: #98c379; }
        .hl-comment { color: #6a737d; font-style: italic; }
        .hl-number { color: #d19a66; }  
        
        .code-output-frame {
            width: 100%; height: 260px; border: none; background: #ffffff;
            border-top: 1px solid #444; display: none;
        }
        
        .sys-msg { background-color: transparent; color: var(--text-muted); align-self: center; font-size: 0.85em; font-style: italic; text-align: center; max-width: 90%; }
        .sys-msg-context {
            text-align: left; max-height: 160px; overflow-y: auto; background: rgba(0,0,0,0.25);
            padding: 10px 14px; border-radius: 6px; white-space: pre-wrap; font-family: 'Consolas', monospace;
            width: 92%; border: 1px solid #383838;
        }
        
        /* Message Action Buttons */
        .msg-actions { display: flex; gap: 10px; margin-top: 5px; opacity: 0; transition: opacity 0.15s; }
        .message-wrapper:hover .msg-actions { opacity: 1; }
        .action-btn {
            background: transparent; border: none; color: #999; font-size: 0.8em;
            cursor: pointer; padding: 2px 4px; display: flex; align-items: center; gap: 4px; border-radius: 3px;
        }
        .action-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
        
        /* === Quick Prompts & Input === */
        #quick-prompts { display: flex; gap: 8px; padding: 8px 15px; background: #181818; border-top: 1px solid var(--border-color); overflow-x: auto; white-space: nowrap; }
        .quick-btn {
            background: #262626; color: #ccc; border: 1px solid #383838;
            border-radius: 14px; padding: 5px 12px; font-size: 0.82em; cursor: pointer; transition: 0.15s;
        }
        .quick-btn:hover { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
        
        #input-container {
            display: flex; padding: 12px 16px; background: var(--bg-surface);
            border-top: 1px solid var(--border-color); align-items: flex-end; gap: 10px;
        }
        #user-input {
            flex-grow: 1; padding: 12px 14px; background-color: var(--bg-input); color: #fff;
            border: 1px solid #444; border-radius: 8px; outline: none; font-size: 0.98em;
            font-family: inherit; resize: none; min-height: 22px; max-height: 150px; overflow-y: auto; line-height: 1.4;
        }
        #user-input:focus { border-color: var(--accent-primary); }
        .btn {
            color: white; border: none; padding: 0 18px; border-radius: 8px;
            cursor: pointer; font-weight: 600; height: 44px; font-size: 0.95em;
            display: inline-flex; align-items: center; justify-content: center; transition: 0.15s;
        }
        #mic-btn { background-color: #383838; padding: 0 14px; }
        #mic-btn:hover:not(:disabled) { background-color: #4a4a4a; }
        #mic-btn.recording { background-color: var(--accent-danger); animation: pulse 1.5s infinite; }
        #send-btn { background-color: var(--accent-primary); }
        #send-btn:hover:not(:disabled) { background-color: var(--accent-hover); }
        #send-btn:disabled { background-color: #383838; color: #777; cursor: not-allowed; }
        #stop-btn { background-color: var(--accent-danger); display: none; }
        #stop-btn:hover { background-color: #b71c1c; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100%; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
        }
    </style>
</head>
<body>

    <div id="app-layout">
        <!-- Debug Terminal Overlay -->
        <div id="debug-terminal">
            <div id="debug-terminal-header">
                <span>🛠️ System Debug Terminal (Strg+D / Cmd+D)</span>
                <button id="export-log-btn" class="action-btn" style="color: white; border: 1px solid #555; padding: 3px 8px;">Logs exportieren (.log)</button>
            </div>
            <div id="debug-log"></div>
        </div>

        <!-- Sidebar / Sessions -->
        <div id="sidebar">
            <div class="sidebar-header"><button class="new-chat-full-btn" id="sidebar-new-btn">➕ Neuer Chat</button></div>
            <div id="session-list"></div>
        </div>

        <!-- Main Chat Area -->
        <div id="chat-container">
            <div id="drag-overlay">Datei hier ablegen (TXT, MD, CSV, JSON, HTML, JS)</div>
            
            <div id="chat-header">
                <div class="header-title-area">
                    <button id="toggle-sidebar-btn" class="icon-btn" title="Seitenleiste ein/ausblenden (Strg+B / Cmd+B)">☰</button>
                    <span>LOCAL (Gemini Nano)</span>
                    <span id="api-status-badge" class="header-status-badge">Prüfe KI...</span>
                </div>
                <div class="header-actions">
                    <button id="toggle-settings-btn" class="icon-btn" title="Einstellungen & Persona">⚙️ Persona</button>
                    <button id="import-btn" class="icon-btn" title="Chat laden (Strg+O / Cmd+O)">📂</button>
                    <input type="file" id="import-file" accept=".txt" style="display: none;">
                    <button id="export-btn" class="icon-btn" title="Chat speichern (Strg+S / Cmd+S)">💾</button>
                </div>
            </div>
            
            <div id="context-bar-container" title="Gedächtnisauslastung"><div id="context-bar-fill"></div></div>
            <button id="compress-btn">🧠 Speicher optimieren (Historie komprimieren)</button>
            
            <div id="settings-panel">
                <div class="settings-field">
                    <label class="settings-label" for="system-prompt">System-Prompt / Persona:</label>
                    <textarea id="system-prompt" rows="2" placeholder="Definiere Rolle, Tonfall und Verhaltensregeln der KI..."></textarea>
                </div>
                <div class="settings-row">
                    <label><input type="checkbox" id="cfg-proxy-allow" checked> Webseiten-Abruf via CORS-Proxy erlauben</label>
                    <input type="text" id="cfg-proxy-url" placeholder="CORS-Proxy URL Präfix" value="https://api.allorigins.win/get?url=">
                </div>
            </div>
            
            <div id="chat-box"></div>

            <div id="quick-prompts">
                <button class="quick-btn" data-action="Zusammenfassen">Zusammenfassen</button>
                <button class="quick-btn" data-action="Code erklären">Code erklären</button>
                <button class="quick-btn" data-action="Fehler analysieren & beheben">Fehler beheben</button>
                <button class="quick-btn" data-action="Kritisch hinterfragen & Alternativen aufzeigen">Kritisch hinterfragen</button>
            </div>

            <div id="input-container">
                <textarea id="user-input" rows="1" placeholder="Prompt, URL oder Text eingeben... (Enter: Senden, Shift+Enter: Zeilenumbruch)" disabled></textarea>
                <button id="mic-btn" class="btn" title="Spracheingabe (Strg+M / Cmd+M)" disabled>🎤</button>
                <button id="send-btn" class="btn" disabled>Senden</button>
                <button id="stop-btn" class="btn">Stopp</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * @typedef {Object} AppConfig
         */
        const CONFIG = {
            SCROLL_THRESHOLD: 30,
            FILE_PREFIX: "--- Lokaler KI-Chat Export ---",
            MAX_WEBPAGE_CHARS: 3500,
            MAX_CONTEXT_CHARS: 12000,
            SAFE_INIT_CHARS: 9000,
            STORAGE_SESSIONS_KEY: "nano_chat_sessions_v5",
            STORAGE_SETTINGS_KEY: "nano_chat_settings_v1",
            MARKERS: { SYS: "---[System]---", USR: "---[Du]---", AI: "---[KI]---" },
            UI: {
                BTN_LOADING: "KI lädt...",
                BTN_SEND: "Senden",
                BTN_ERROR: "Fehler",
                BTN_COMPRESS: "Komprimiere..."
            },
            DEFAULT_PROXY_URL: "https://api.allorigins.win/get?url=",
            PROXY_TIMEOUT_MS: 8000
        };

        class AIChatApp {
            constructor() {
                this.dom = {
                    sidebar: document.getElementById('sidebar'),
                    sessionList: document.getElementById('session-list'),
                    chatBox: document.getElementById('chat-box'),
                    userInput: document.getElementById('user-input'),
                    sendBtn: document.getElementById('send-btn'),
                    stopBtn: document.getElementById('stop-btn'),
                    micBtn: document.getElementById('mic-btn'),
                    sysPrompt: document.getElementById('system-prompt'),
                    settingsPanel: document.getElementById('settings-panel'),
                    cfgProxyAllow: document.getElementById('cfg-proxy-allow'),
                    cfgProxyUrl: document.getElementById('cfg-proxy-url'),
                    apiStatusBadge: document.getElementById('api-status-badge'),
                    importFile: document.getElementById('import-file'),
                    contextContainer: document.getElementById('context-bar-container'),
                    contextFill: document.getElementById('context-bar-fill'),
                    dragOverlay: document.getElementById('drag-overlay'),
                    debugTerminal: document.getElementById('debug-terminal'),
                    debugLog: document.getElementById('debug-log'),
                    exportLogBtn: document.getElementById('export-log-btn'),
                    compressBtn: document.getElementById('compress-btn')
                };

                this.state = {
                    session: null,
                    isAborted: false,
                    isAutoScrollActive: true,
                    isRecording: false,
                    pendingFileContext: null,
                    sessionsData: [],
                    currentSessionId: null,
                    logs: [],
                    resizeScheduled: false,
                    settings: {
                        allowProxy: true,
                        proxyUrl: CONFIG.DEFAULT_PROXY_URL
                    }
                };

                if (window.innerWidth < 768) {
                    this.dom.sidebar.classList.add('hidden');
                }

                this.setupGlobalErrorHandlers();
                this.loadSettings();
                this.setupSpeechRecognition();
                this.bindEvents();
                this.loadSessionsFromStorage();
            }

            // ==========================================
            // DEBUG ENGINE
            // ==========================================
            setupGlobalErrorHandlers() {
                window.onerror = (msg, src, lineno, colno, err) => {
                    this.debug('ERROR', `Runtime: ${msg} (${src}:${lineno})`, err?.stack);
                    return false;
                };
                window.addEventListener('unhandledrejection', (e) => {
                    this.debug('ERROR', `Unhandled Promise: ${e.reason}`, e.reason?.stack);
                });
            }

            debug(level, message, obj = null) {
                const ts = new Date().toISOString().split('T')[1].slice(0, -1);
                this.state.logs.push({ ts, level, message, obj });
                if (this.dom.debugLog) {
                    const div = document.createElement('div');
                    div.className = `log-${level.toLowerCase()}`;
                    div.textContent = `[${ts}] [${level}] ${message}` + (obj ? ` | ${typeof obj === 'object' ? JSON.stringify(obj) : obj}` : '');
                    this.dom.debugLog.appendChild(div);
                    this.dom.debugLog.scrollTop = this.dom.debugLog.scrollHeight;
                }
            }

            toggleDebugTerminal() {
                const isHidden = getComputedStyle(this.dom.debugTerminal).display === 'none';
                this.dom.debugTerminal.style.display = isHidden ? 'flex' : 'none';
            }

            exportLogs() {
                const logText = this.state.logs.map(l => `[${l.ts}] [${l.level}] ${l.message} ${l.obj ? JSON.stringify(l.obj) : ''}`).join('\n');
                const blob = new Blob([logText], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `local-debug-${Date.now()}.log`;
                a.click();
            }

            // ==========================================
            // SETTINGS ENGINE
            // ==========================================
            loadSettings() {
                try {
                    const raw = localStorage.getItem(CONFIG.STORAGE_SETTINGS_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        this.state.settings = { ...this.state.settings, ...parsed };
                    }
                } catch (e) {
                    this.debug('WARN', 'Settings Ladefehler', e.message);
                }
                this.dom.cfgProxyAllow.checked = this.state.settings.allowProxy;
                this.dom.cfgProxyUrl.value = this.state.settings.proxyUrl || CONFIG.DEFAULT_PROXY_URL;
            }

            saveSettings() {
                this.state.settings.allowProxy = this.dom.cfgProxyAllow.checked;
                this.state.settings.proxyUrl = this.dom.cfgProxyUrl.value.trim() || CONFIG.DEFAULT_PROXY_URL;
                try {
                    localStorage.setItem(CONFIG.STORAGE_SETTINGS_KEY, JSON.stringify(this.state.settings));
                } catch (e) {
                    this.debug('WARN', 'Settings Speicherfehler', e.message);
                }
            }

            // ==========================================
            // CHROME PROMPT API ADAPTER
            // ==========================================
            getLanguageModelAPI() {
                if (typeof window.LanguageModel !== 'undefined') {
                    return window.LanguageModel;
                }
                if (typeof window.ai !== 'undefined' && window.ai.languageModel) {
                    return window.ai.languageModel;
                }
                return null;
            }

            async checkAvailability(api, options) {
                if (typeof api.availability === 'function') {
                    return await api.availability(options);
                }
                if (typeof api.capabilities === 'function') {
                    const caps = await api.capabilities();
                    return caps.available || (caps.defaultTemperature !== undefined ? 'readily' : 'unavailable');
                }
                return 'readily';
            }

            updateApiBadge(status, label) {
                if (!this.dom.apiStatusBadge) return;
                this.dom.apiStatusBadge.className = 'header-status-badge ' + (status === 'ok' ? 'status-ok' : status === 'warn' ? 'status-warn' : 'status-err');
                this.dom.apiStatusBadge.textContent = label;
            }

            async connectToAI(withHistory = false) {
                this.debug('INFO', `Initialisiere KI (History-Modus: ${withHistory})`);
                
                if (this.state.session && typeof this.state.session.destroy === 'function') {
                    try { this.state.session.destroy(); } catch (e) {}
                }
                this.state.session = null;
                
                this.dom.sendBtn.textContent = CONFIG.UI.BTN_LOADING;
                this.setUIState(false);
                this.updateApiBadge('warn', 'KI lädt...');

                try {
                    const api = this.getLanguageModelAPI();
                    if (!api) {
                        throw new Error("Weder window.LanguageModel noch window.ai.languageModel im Browser verfügbar. Bitte Chrome-Flags prüfen.");
                    }

                    const options = {
                        expectedInputs: [{ type: 'text', languages: ['en', 'de'] }],
                        expectedOutputs: [{ type: 'text', languages: ['en', 'de'] }]
                    };

                    let finalSystemPrompt = this.dom.sysPrompt.value.trim() ? `System-Anweisung: ${this.dom.sysPrompt.value.trim()}\n\n` : "";

                    if (withHistory) {
                        // Skip any element marked regenerating-skip to prevent prompt duplication
                        const wrappers = Array.from(this.dom.chatBox.querySelectorAll('.message-wrapper:not(.regenerating-skip)'));
                        let historyText = "";
                        let currentLength = finalSystemPrompt.length;
                        
                        for (let i = wrappers.length - 1; i >= 0; i--) {
                            const role = wrappers[i].classList.contains('wrapper-user') ? "User" : "KI";
                            const msgChunk = `${role}: ${wrappers[i].dataset.rawText}\n\n`;
                            
                            if (currentLength + msgChunk.length > CONFIG.SAFE_INIT_CHARS) {
                                this.debug('WARN', 'Token-Budget erreicht. Ältere Historie wird für diesen Start gekürzt.');
                                break;
                            }
                            historyText = msgChunk + historyText;
                            currentLength += msgChunk.length;
                        }
                        
                        if (historyText) finalSystemPrompt += `Bisheriger Chatverlauf:\n${historyText}`;
                    }

                    if (finalSystemPrompt) {
                        options.systemPrompt = finalSystemPrompt;
                    }

                    const avail = await this.checkAvailability(api, options);
                    this.debug('INFO', `API Availability: ${avail}`);

                    if (avail === 'unavailable' || avail === 'no') {
                        throw new Error(`Modell meldet Status "${avail}". Modell in Chrome heruntergeladen?`);
                    }

                    // Erstelle Sitzung mit robustem Fallback bei unbekannten Parametern
                    try {
                        this.state.session = await api.create(options);
                    } catch (optError) {
                        this.debug('WARN', 'create(options) mit erweiterten Feldern fehlgeschlagen, Fallback auf einfaches systemPrompt', optError.message);
                        const fallbackOpt = options.systemPrompt ? { systemPrompt: options.systemPrompt } : {};
                        this.state.session = await api.create(fallbackOpt);
                    }

                    this.dom.sendBtn.textContent = CONFIG.UI.BTN_SEND;
                    this.setUIState(true);
                    this.updateApiBadge('ok', 'Gemini Nano bereit');
                    this.updateContextBar();
                } catch (error) {
                    this.debug('ERROR', 'Verbindungsfehler', error.message);
                    this.addSysMessage("Fehler beim Verbindungsaufbau: " + error.message);
                    this.dom.sendBtn.textContent = CONFIG.UI.BTN_ERROR;
                    this.updateApiBadge('err', 'KI Offline');
                }
            }

            // ==========================================
            // MULTI-SESSION & STORAGE
            // ==========================================
            loadSessionsFromStorage() {
                try {
                    const data = localStorage.getItem(CONFIG.STORAGE_SESSIONS_KEY);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed)) {
                            this.state.sessionsData = parsed;
                        } else {
                            this.debug('WARN', 'Sessions-Daten ungültig formatiert, initialisiere neu.');
                            this.state.sessionsData = [];
                        }
                    }
                } catch (e) {
                    this.debug('ERROR', 'Ladefehler Storage', e.message);
                    this.state.sessionsData = [];
                }

                if (this.state.sessionsData.length > 0) {
                    this.switchSession(this.state.sessionsData[0].id);
                } else {
                    this.createNewSession();
                }
                this.renderSidebar();
            }

            scheduleSave() {
                if (this._saveTimer) clearTimeout(this._saveTimer);
                this._saveTimer = setTimeout(() => this.saveSessionsToStorage(), 1500);
            }

            saveSessionsToStorage() {
                if (this.state.currentSessionId) {
                    const idx = this.state.sessionsData.findIndex(s => s.id === this.state.currentSessionId);
                    if (idx > -1) {
                        this.state.sessionsData[idx].data = this.generateExportString();
                        const firstMsg = this.dom.chatBox.querySelector('.wrapper-user');
                        if (firstMsg) {
                            const raw = (firstMsg.dataset.rawText || "").trim().replace(/\s+/g, ' ');
                            this.state.sessionsData[idx].title = raw.length > 32 ? raw.substring(0, 32) + "..." : (raw || "Neuer Chat");
                        }
                    }
                }
                try {
                    localStorage.setItem(CONFIG.STORAGE_SESSIONS_KEY, JSON.stringify(this.state.sessionsData));
                } catch (e) {
                    this.debug('ERROR', 'Storage Quota Limit', e.message);
                    this.addSysMessage("⚠️ Warnung: Browser-Speicherplatz (LocalStorage) voll! Bitte alte Chats löschen oder exportieren.");
                }
                this.renderSidebar();
                this.updateContextBar();
            }

            renderSidebar() {
                this.dom.sessionList.innerHTML = '';
                this.state.sessionsData.forEach(s => {
                    const div = document.createElement('div');
                    div.className = `session-item ${s.id === this.state.currentSessionId ? 'active' : ''}`;
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'session-item-title';
                    titleSpan.textContent = s.title || "Neuer Chat";
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = 'session-item-delete';
                    delBtn.title = 'Chat löschen';
                    delBtn.textContent = '✕';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        this.state.sessionsData = this.state.sessionsData.filter(x => x.id !== s.id);
                        if (this.state.currentSessionId === s.id) {
                            if (this.state.sessionsData.length > 0) {
                                this.switchSession(this.state.sessionsData[0].id);
                            } else {
                                this.createNewSession();
                            }
                        } else {
                            this.saveSessionsToStorage();
                        }
                    };

                    div.appendChild(titleSpan);
                    div.appendChild(delBtn);
                    div.onclick = () => this.switchSession(s.id);
                    this.dom.sessionList.appendChild(div);
                });
            }

            async createNewSession() {
                if (this.state.currentSessionId) this.saveSessionsToStorage();
                const newId = Date.now().toString();
                this.state.sessionsData.unshift({ id: newId, title: "Neuer Chat", data: CONFIG.FILE_PREFIX + "\n" });
                await this.switchSession(newId);
            }

            async switchSession(id) {
                if (this.state.currentSessionId && this.state.currentSessionId !== id) {
                    this.saveSessionsToStorage();
                }
                this.state.currentSessionId = id;
                const sessionObj = this.state.sessionsData.find(s => s.id === id);
                if (sessionObj) {
                    this.dom.chatBox.innerHTML = '';
                    await this.loadFromString(sessionObj.data, false);
                    await this.connectToAI(true);
                }
                this.renderSidebar();
            }

            // ==========================================
            // UI HELPER & CONTEXT
            // ==========================================
            scrollToBottom(force = false) { 
                if (force || this.state.isAutoScrollActive) {
                    this.dom.chatBox.scrollTop = this.dom.chatBox.scrollHeight;
                }
            }
            
            triggerInputResize(clear = false) {
                if (clear) this.dom.userInput.value = '';
                if (!this.state.resizeScheduled) {
                    this.state.resizeScheduled = true;
                    requestAnimationFrame(() => {
                        this.dom.userInput.style.height = 'auto';
                        this.dom.userInput.style.height = Math.min(150, this.dom.userInput.scrollHeight) + 'px';
                        if (this.dom.userInput.value === '') this.dom.userInput.style.height = 'auto';
                        this.state.resizeScheduled = false;
                    });
                }
            }

            setUIState(isReady, isGenerating = false) {
                this.dom.userInput.disabled = !isReady;
                this.dom.sendBtn.disabled = !isReady;
                if (this.recognition) this.dom.micBtn.disabled = !isReady;
                this.dom.sendBtn.style.display = isGenerating ? 'none' : 'inline-flex';
                this.dom.stopBtn.style.display = isGenerating ? 'inline-flex' : 'none';
            }

            updateContextBar() {
                let charCount = 0;
                this.dom.chatBox.querySelectorAll('.message-wrapper, .sys-msg-context').forEach(w => {
                    charCount += (w.dataset.rawText || w.textContent || "").length;
                });
                
                const percentage = Math.min(100, (charCount / CONFIG.MAX_CONTEXT_CHARS) * 100);
                this.dom.contextFill.style.width = percentage + '%';
                this.dom.contextFill.style.backgroundColor = percentage > 85 ? '#d32f2f' : percentage > 65 ? '#fbc02d' : '#4caf50'; 
                
                const roundedPct = Math.round(percentage);
                this.dom.contextContainer.title = `Gedächtnisauslastung: ca. ${charCount} / ${CONFIG.MAX_CONTEXT_CHARS} Zeichen (${roundedPct}%)`;
                
                if (this.dom.compressBtn) {
                    this.dom.compressBtn.style.display = percentage > 65 ? 'flex' : 'none';
                }
            }

            // ==========================================
            // CONTEXT COMPRESSION (SLIDING WINDOW)
            // ==========================================
            async compressHistory() {
                const wrappers = Array.from(this.dom.chatBox.querySelectorAll('.message-wrapper, .sys-msg-context'));
                const keepCount = 4;
                if (wrappers.length <= keepCount) return;

                const oldWrappers = wrappers.slice(0, wrappers.length - keepCount);
                let textToCompress = "";
                oldWrappers.forEach(w => {
                    const role = w.classList.contains('wrapper-user') ? "User: " : (w.classList.contains('sys-msg-context') ? "System: " : "KI: ");
                    textToCompress += role + (w.dataset.rawText || w.textContent) + "\n\n";
                });

                if (textToCompress.length > CONFIG.SAFE_INIT_CHARS) {
                    textToCompress = textToCompress.substring(0, CONFIG.SAFE_INIT_CHARS);
                }

                this.setUIState(false);
                this.dom.sendBtn.textContent = CONFIG.UI.BTN_COMPRESS;
                this.dom.compressBtn.style.display = 'none';

                try {
                    const api = this.getLanguageModelAPI();
                    if (!api) throw new Error("Keine KI-Engine verfügbar.");

                    const summarySession = await api.create({
                        systemPrompt: "Du bist ein präziser KI-Archivar. Fasse diesen Chat-Verlauf kompakt zusammen. Behalte alle relevanten Fakten, Entscheidungen und Code-Ausschnitte bei."
                    });
                    const summary = await summarySession.prompt("Fasse diesen Verlauf zusammen:\n\n" + textToCompress);
                    if (typeof summarySession.destroy === 'function') summarySession.destroy(); 

                    oldWrappers.forEach(w => w.remove());

                    const archiveDiv = document.createElement('div');
                    archiveDiv.className = 'message sys-msg sys-msg-context';
                    archiveDiv.style.borderLeft = "4px solid #fbc02d";
                    archiveDiv.innerHTML = `<strong>🧠 Gedächtnis-Archiv (Komprimiert):</strong><br><br>${this.parseMarkdown(summary)}`;
                    archiveDiv.dataset.rawText = `[Zusammenfassung der Historie]: ${summary}`;
                    this.dom.chatBox.prepend(archiveDiv);
                    
                    this.addSysMessage("✅ Frühere Nachrichten wurden erfolgreich verdichtet.");
                    this.scheduleSave();
                } catch (error) {
                    this.addSysMessage("❌ Fehler bei der Komprimierung: " + error.message);
                } finally {
                    this.dom.sendBtn.textContent = CONFIG.UI.BTN_SEND;
                    this.setUIState(true);
                    await this.connectToAI(true);
                }
            }

            // ==========================================
            // CHAT ENGINE & STREAMING
            // ==========================================
            async handleSend(isRegenerate = false) {
                const text = this.dom.userInput.value.trim();
                if (!text || !this.state.session) return;

                if (!isRegenerate) this.addMessage(text, 'user-msg');
                this.triggerInputResize(true);
                this.setUIState(false, true); 
                this.state.isAborted = false;

                let finalPrompt = text;
                if (this.state.pendingFileContext) {
                    finalPrompt = `${this.state.pendingFileContext}---\nAufgabe:\n${text}`;
                    this.state.pendingFileContext = null; 
                } else {
                    const urls = text.match(/(https?:\/\/[^\s]+)/g);
                    if (urls && urls.length > 0) {
                        this.addSysMessage(`Prüfe Link-Inhalt von: ${urls[0]} ...`);
                        const pageText = await this.fetchWebpageText(urls[0]);
                        if (pageText) {
                            this.addSysMessage("✅ Text aus Webseite geladen.");
                            finalPrompt = `Kontext (${urls[0]}):\n\n${pageText}\n\n---\nAufgabe:\n${text}`;
                        }
                    }
                }

                const aiTextNode = this.addMessage("...", "ai-msg");
                try {
                    await this.streamResponse(finalPrompt, aiTextNode);
                } catch (error) {
                    aiTextNode.innerHTML = this.parseMarkdown("Fehler bei der Generierung: " + error.message);
                } finally {
                    this.setUIState(true);
                    this.dom.userInput.focus();
                    this.scheduleSave();
                }
            }

            async streamResponse(prompt, targetNode) {
                const stream = this.state.session.promptStreaming(prompt);
                let fullResponse = '';
                let updateScheduled = false;

                for await (const chunk of stream) {
                    if (this.state.isAborted) break;
                    fullResponse += chunk; 
                    if (!updateScheduled) {
                        updateScheduled = true;
                        requestAnimationFrame(() => {
                            targetNode.innerHTML = this.parseMarkdown(fullResponse); 
                            targetNode.closest('.message-wrapper').dataset.rawText = fullResponse;
                            this.scrollToBottom();
                            this.updateContextBar();
                            updateScheduled = false;
                        });
                    }
                }
                
                targetNode.innerHTML = this.parseMarkdown(fullResponse);
                targetNode.closest('.message-wrapper').dataset.rawText = fullResponse;
                this.scrollToBottom();
                this.updateContextBar();
            }

            // ==========================================
            // EDIT & REGENERATE
            // ==========================================
            handleEditUserMessage(wrapper) {
                const rawText = wrapper.dataset.rawText;
                const textNode = wrapper.querySelector('.msg-text');
                textNode.innerHTML = '';
                
                const ta = document.createElement('textarea');
                ta.className = 'edit-area';
                ta.value = rawText; 
                
                const saveBtn = document.createElement('button');
                saveBtn.className = 'save-edit-btn';
                saveBtn.textContent = 'Speichern & Neu senden';
                
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'cancel-edit-btn';
                cancelBtn.textContent = 'Abbrechen';
                
                textNode.append(ta, saveBtn, cancelBtn);
                ta.focus();
                
                saveBtn.onclick = async () => {
                    const newText = ta.value.trim();
                    if (!newText) return;
                    while (wrapper.nextSibling) wrapper.nextSibling.remove();
                    wrapper.remove(); 
                    this.dom.userInput.value = newText;
                    await this.connectToAI(true); 
                    this.handleSend();
                };
                cancelBtn.onclick = () => { textNode.textContent = rawText; };
            }

            async handleRegenerateAI(wrapper) {
                let prev = wrapper.previousElementSibling;
                while (prev && !prev.classList.contains('wrapper-user')) {
                    prev = prev.previousElementSibling;
                }
                if (!prev) return;
                const userPrompt = prev.dataset.rawText;
                
                // Entferne die AI-Antwort und alle nachfolgenden Elemente
                while (prev.nextSibling) prev.nextSibling.remove();
                
                // Verhindere Prompt-Duplikation: Das letzte User-Element temporär bei Historien-Extraktion aussparen
                prev.classList.add('regenerating-skip');
                await this.connectToAI(true);
                prev.classList.remove('regenerating-skip');

                this.dom.userInput.value = userPrompt;
                await this.handleSend(true);
            }

            // ==========================================
            // STRICT MARKDOWN & SYNTAX ENGINE
            // ==========================================
            escapeHtml(str) {
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            parseMarkdown(text) {
                if (!text) return "";

                // 1. Sichere Platzhalter mit kryptografischer Eindeutigkeit extrahieren
                const codeBlocks = [];
                const blockMarker = `__LOCAL_CB_${Math.random().toString(36).slice(2)}_${Date.now()}_`;
                
                let html = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
                    const idx = codeBlocks.length;
                    codeBlocks.push({ lang: (lang || '').trim(), code: code.replace(/\n$/, '') });
                    return `${blockMarker}${idx}__`;
                });

                // 2. Strict XSS Sanitization für den verbleibenden Markdown-Fließtext
                html = this.escapeHtml(html);

                // 3. Sichere Struktur-Elemente parsen
                html = html.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
                html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                
                // Überschriften
                html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
                html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
                html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
                
                // Zitate & Listen
                html = html.replace(/^(?:&gt;|>)\s?(.*$)/gim, '<blockquote>$1</blockquote>');
                html = html.replace(/^\s*[-*]\s+(.*$)/gim, '<li>$1</li>');
                
                // Absätze und Umbrüche
                html = html.replace(/\n\n+/g, '</p><p>');
                html = html.replace(/\n/g, '<br>');

                // 4. Code-Blöcke wieder einsetzen mit robuster Syntax-Hervorhebung
                codeBlocks.forEach((block, i) => {
                    const rawExecCode = encodeURIComponent(block.code);
                    const highlighted = this.highlightSyntax(block.code);
                    
                    const blockHtml = `</p><div class="code-wrap">
                        <div class="code-header">
                            <span>${this.escapeHtml(block.lang) || 'Code'}</span>
                            <div class="code-actions" data-raw="${rawExecCode}">
                                <button class="action-btn code-copy">📋 Kopieren</button>
                                <button class="action-btn code-run" title="Isolierte Sandbox">▶️ Ausführen</button>
                            </div>
                        </div>
                        <pre><code>${highlighted}</code></pre>
                    </div><p>`;
                    
                    html = html.replace(`${blockMarker}${i}__`, blockHtml);
                });

                return `<p>${html}</p>`.replace(/<p>\s*<\/p>/g, '');
            }

            highlightSyntax(code) {
                // Präzise Tokenisierung des RAW-Codes: Keywords, Strings, Numbers, Comments
                const tokenRegex = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\`|[\s\S])*?`|"(?:\\下|[^"\\])*"|'(?:\\'|[^'\\])*')|\b(0x[0-9a-fA-F]+|\d+(?:\.\d+)?)\b|\b(const|let|var|function|class|import|export|return|if|else|for|while|async|await|try|catch|new|true|false|null|undefined|document|window)\b/g;

                let result = "";
                let lastIdx = 0;
                let match;

                while ((match = tokenRegex.exec(code)) !== null) {
                    if (match.index > lastIdx) {
                        result += this.escapeHtml(code.slice(lastIdx, match.index));
                    }
                    if (match[1]) {
                        result += `<span class="hl-comment">${this.escapeHtml(match[1])}</span>`;
                    } else if (match[2]) {
                        result += `<span class="hl-string">${this.escapeHtml(match[2])}</span>`;
                    } else if (match[3]) {
                        result += `<span class="hl-number">${this.escapeHtml(match[3])}</span>`;
                    } else if (match[4]) {
                        result += `<span class="hl-keyword">${this.escapeHtml(match[4])}</span>`;
                    }
                    lastIdx = tokenRegex.lastIndex;
                }
                if (lastIdx < code.length) {
                    result += this.escapeHtml(code.slice(lastIdx));
                }
                return result;
            }

            // ==========================================
            // AUDIO & FILE HELPERS
            // ==========================================
            setupSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    this.recognition = new SpeechRecognition();
                    this.recognition.lang = navigator.language || 'de-DE';
                    this.recognition.onresult = (e) => {
                        this.dom.userInput.value += (this.dom.userInput.value ? ' ' : '') + e.results[0][0].transcript;
                        this.triggerInputResize();
                    };
                    this.recognition.onend = () => {
                        this.state.isRecording = false;
                        this.dom.micBtn.classList.remove('recording');
                    };
                    this.recognition.onerror = () => {
                        this.state.isRecording = false;
                        this.dom.micBtn.classList.remove('recording');
                    };
                } else {
                    this.dom.micBtn.style.display = 'none';
                }
            }

            toggleMic() {
                if (!this.recognition) return;
                if (this.state.isRecording) {
                    this.recognition.stop();
                } else {
                    try {
                        this.recognition.start();
                        this.state.isRecording = true;
                        this.dom.micBtn.classList.add('recording');
                    } catch (e) {
                        this.debug('WARN', 'Mic Start Fehler', e.message);
                    }
                }
            }

            toggleTTS(btn) {
                const isSpeaking = btn.dataset.speaking === "true";
                window.speechSynthesis.cancel();
                document.querySelectorAll('.tts-btn').forEach(b => {
                    b.innerHTML = '🔊 Vorlesen';
                    b.dataset.speaking = "false";
                });
                if (isSpeaking) return;

                const raw = btn.closest('.message-wrapper').dataset.rawText || "";
                const cleanText = raw.replace(/[*`_#~>]/g, '').trim();
                if (!cleanText) return;

                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = /[äöüß]/i.test(cleanText) || /\b(der|die|das|und|ist|nicht)\b/i.test(cleanText) ? 'de-DE' : 'en-US';
                
                utterance.onend = () => {
                    btn.innerHTML = '🔊 Vorlesen';
                    btn.dataset.speaking = "false";
                };
                utterance.onerror = () => {
                    btn.innerHTML = '🔊 Vorlesen';
                    btn.dataset.speaking = "false";
                };

                btn.innerHTML = '⏹ Stopp';
                btn.dataset.speaking = "true";
                window.speechSynthesis.speak(utterance);
            }

            handleFileDrop(file) {
                if (!file.name.match(/\.(txt|md|csv|json|html|js|css|yaml|yml|log)$/i)) {
                    this.addSysMessage(`⚠️ Format von '${file.name}' wird für direkte Textanalyse nicht unterstützt.`);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    let content = e.target.result;
                    if (content.length > CONFIG.MAX_WEBPAGE_CHARS) {
                        content = content.substring(0, CONFIG.MAX_WEBPAGE_CHARS) + "\n... [Vorschau gekürzt]";
                    }
                    this.state.pendingFileContext = `Datei '${file.name}':\n\n${content}\n\n`;
                    this.addSysMessage(`✅ Datei '${file.name}' als Kontext hinterlegt.`);
                    this.dom.userInput.focus();
                };
                reader.readAsText(file);
            }

            async fetchWebpageText(url) {
                if (!this.state.settings.allowProxy) {
                    this.addSysMessage("ℹ️ Externer Proxy für URL-Abruf in Einstellungen deaktiviert.");
                    return null;
                }
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), CONFIG.PROXY_TIMEOUT_MS);
                    const proxyUrl = `${this.state.settings.proxyUrl}${encodeURIComponent(url)}`;
                    
                    const response = await fetch(proxyUrl, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) throw new Error(`HTTP Status ${response.status}`);
                    const json = await response.json();
                    const html = json.contents || json;
                    
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    doc.querySelectorAll('script, style, nav, header, footer, iframe, noscript, svg').forEach(el => el.remove());
                    let text = doc.body.textContent.replace(/\s+/g, ' ').trim();
                    return text.length > CONFIG.MAX_WEBPAGE_CHARS ? text.substring(0, CONFIG.MAX_WEBPAGE_CHARS) + "\n... [Gekürzt]" : text;
                } catch (e) {
                    this.debug('WARN', 'Webpage Fetch Fehler', e.message);
                    this.addSysMessage(`⚠️ URL-Abruf von ${url} fehlgeschlagen (${e.name === 'AbortError' ? 'Timeout' : e.message}).`);
                    return null;
                }
            }

            // ==========================================
            // UI BUILDER
            // ==========================================
            addSysMessage(text) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message sys-msg';
                if (text.length > 180) msgDiv.classList.add('sys-msg-context');
                msgDiv.textContent = text;
                this.dom.chatBox.appendChild(msgDiv);
                this.scrollToBottom();
                this.updateContextBar();
                this.scheduleSave();
            }

            addMessage(text, senderClass) {
                const wrapper = document.createElement('div');
                wrapper.className = `message-wrapper ${senderClass === 'user-msg' ? 'wrapper-user' : 'wrapper-ai'}`;
                wrapper.dataset.rawText = text;
                
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${senderClass}`;
                
                const textSpan = document.createElement('div');
                textSpan.className = 'msg-text';
                
                if (senderClass === 'ai-msg') {
                    textSpan.innerHTML = this.parseMarkdown(text);
                } else {
                    textSpan.textContent = text;
                }
                
                msgDiv.appendChild(textSpan);
                wrapper.appendChild(msgDiv);

                const actionDiv = document.createElement('div');
                actionDiv.className = 'msg-actions';
                if (senderClass === 'user-msg') {
                    actionDiv.innerHTML = `<button class="action-btn edit-btn">✏️ Bearbeiten</button>`;
                } else if (senderClass === 'ai-msg') {
                    actionDiv.innerHTML = `
                        <button class="action-btn copy-btn">📋 Kopieren</button>
                        <button class="action-btn tts-btn" data-speaking="false">🔊 Vorlesen</button>
                        <button class="action-btn regen-btn" title="Antwort neu anfordern">🔄 Neu generieren</button>
                    `;
                }
                wrapper.appendChild(actionDiv);

                this.dom.chatBox.appendChild(wrapper);
                this.scrollToBottom();
                this.updateContextBar();
                return textSpan; 
            }

            // ==========================================
            // EXPORT / IMPORT
            // ==========================================
            generateExportString() {
                let chatText = CONFIG.FILE_PREFIX + "\n";
                this.dom.chatBox.querySelectorAll('.message-wrapper, .sys-msg').forEach(w => {
                    if (w.classList.contains('sys-msg')) {
                        chatText += `\n${CONFIG.MARKERS.SYS}\n${w.textContent}\n`;
                    } else {
                        const marker = w.classList.contains('wrapper-user') ? CONFIG.MARKERS.USR : CONFIG.MARKERS.AI;
                        chatText += `\n${marker}\n${w.dataset.rawText || ''}\n`;
                    }
                });
                return chatText;
            }

            exportChat() {
                const text = this.generateExportString();
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `local-chat-${Date.now()}.txt`;
                a.click();
            }

            async loadFromString(content, skipInit = false) {
                const lines = content.replace(/\r\n/g, '\n').split('\n');
                if (!lines[0] || !lines[0].startsWith(CONFIG.FILE_PREFIX)) return;

                this.dom.chatBox.innerHTML = '';
                if (this.state.session && typeof this.state.session.destroy === 'function') {
                    try { this.state.session.destroy(); } catch (err) {}
                }
                this.state.session = null;

                let currentRole = null;
                let currentText = [];

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line === CONFIG.MARKERS.USR || line === CONFIG.MARKERS.AI || line === CONFIG.MARKERS.SYS) {
                        if (currentRole) this.dispatchParsedMessage(currentRole, currentText.join('\n').trim());
                        currentRole = line === CONFIG.MARKERS.USR ? 'Du' : (line === CONFIG.MARKERS.AI ? 'KI' : 'System');
                        currentText = [];
                    } else {
                        if (currentRole) currentText.push(lines[i]); 
                    }
                }
                if (currentRole) this.dispatchParsedMessage(currentRole, currentText.join('\n').trim());
                if (!skipInit) await this.connectToAI(true);
            }

            dispatchParsedMessage(role, text) {
                if (!text) return;
                if (role === 'System') this.addSysMessage(text);
                else if (role === 'Du') this.addMessage(text, 'user-msg');
                else if (role === 'KI') this.addMessage(text, 'ai-msg');
            }

            // ==========================================
            // EVENT BINDINGS
            // ==========================================
            bindEvents() {
                this.dom.exportLogBtn.addEventListener('click', () => this.exportLogs());
                if (this.dom.compressBtn) {
                    this.dom.compressBtn.addEventListener('click', () => this.compressHistory());
                }

                document.getElementById('toggle-sidebar-btn').addEventListener('click', () => {
                    this.dom.sidebar.classList.toggle('hidden');
                });
                
                document.getElementById('toggle-settings-btn').addEventListener('click', () => {
                    const isVisible = getComputedStyle(this.dom.settingsPanel).display === 'flex';
                    this.dom.settingsPanel.style.display = isVisible ? 'none' : 'flex';
                });

                this.dom.cfgProxyAllow.addEventListener('change', () => this.saveSettings());
                this.dom.cfgProxyUrl.addEventListener('change', () => this.saveSettings());

                document.getElementById('sidebar-new-btn').addEventListener('click', () => this.createNewSession());
                document.getElementById('import-btn').addEventListener('click', () => this.dom.importFile.click());
                document.getElementById('export-btn').addEventListener('click', () => this.exportChat());

                this.dom.importFile.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const r = new FileReader();
                    r.onload = async (ev) => {
                        this.dom.chatBox.innerHTML = '';
                        await this.loadFromString(ev.target.result);
                        this.scheduleSave();
                    };
                    r.readAsText(file);
                    e.target.value = ''; 
                });

                this.dom.sendBtn.addEventListener('click', () => this.handleSend());
                this.dom.stopBtn.addEventListener('click', () => { this.state.isAborted = true; });
                this.dom.micBtn.addEventListener('click', () => this.toggleMic());

                document.getElementById('quick-prompts').addEventListener('click', (e) => {
                    if (e.target.classList.contains('quick-btn')) {
                        const action = e.target.dataset.action;
                        const currentVal = this.dom.userInput.value.trim();
                        this.dom.userInput.value = currentVal ? `Bitte "${action}":\n\n${currentVal}` : `Bitte "${action}": \n`;
                        if (currentVal) this.handleSend(); else this.dom.userInput.focus();
                    }
                });

                this.dom.chatBox.addEventListener('click', (e) => {
                    const t = e.target;
                    if (t.closest('.copy-btn')) {
                        const btn = t.closest('.copy-btn');
                        navigator.clipboard.writeText(btn.closest('.message-wrapper').dataset.rawText || '');
                        btn.innerHTML = '✅';
                        setTimeout(() => { btn.innerHTML = '📋 Kopieren'; }, 2000);
                    } else if (t.closest('.edit-btn')) {
                        this.handleEditUserMessage(t.closest('.message-wrapper'));
                    } else if (t.closest('.regen-btn')) {
                        this.handleRegenerateAI(t.closest('.message-wrapper'));
                    } else if (t.closest('.code-copy')) {
                        const actions = t.closest('.code-actions');
                        navigator.clipboard.writeText(decodeURIComponent(actions.dataset.raw));
                        const btn = t.closest('.code-copy');
                        btn.innerHTML = '✅';
                        setTimeout(() => { btn.innerHTML = '📋 Kopieren'; }, 2000);
                    } else if (t.closest('.code-run')) {
                        const btn = t.closest('.code-run');
                        const wrap = t.closest('.code-wrap');
                        const rawCode = decodeURIComponent(t.closest('.code-actions').dataset.raw);
                        let iframe = wrap.querySelector('.code-output-frame');
                        
                        if (iframe && iframe.style.display === 'block') {
                            iframe.style.display = 'none';
                            iframe.srcdoc = '';
                            btn.textContent = '▶️ Ausführen';
                            return;
                        }
                        
                        if (!iframe) {
                            iframe = document.createElement('iframe');
                            iframe.className = 'code-output-frame';
                            iframe.sandbox = 'allow-scripts'; // Streng isolierte Ausführung ohne same-origin Rechte
                            wrap.appendChild(iframe);
                        }
                        
                        iframe.style.display = 'block';
                        btn.textContent = '⏹ Schließen';
                        iframe.srcdoc = rawCode;
                    } else if (t.closest('.tts-btn')) {
                        this.toggleTTS(t.closest('.tts-btn'));
                    }
                });

                this.dom.chatBox.addEventListener('scroll', () => {
                    this.state.isAutoScrollActive = (this.dom.chatBox.scrollHeight - this.dom.chatBox.clientHeight <= this.dom.chatBox.scrollTop + CONFIG.SCROLL_THRESHOLD);
                });

                this.dom.userInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        if (!this.dom.userInput.disabled) this.handleSend();
                    }
                });
                this.dom.userInput.addEventListener('input', () => this.triggerInputResize());

                // Hotkey Handler (Cross-Platform Ctrl & Cmd)
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        switch (e.key.toLowerCase()) {
                            case 'd': e.preventDefault(); this.toggleDebugTerminal(); break;
                            case 'm': e.preventDefault(); this.toggleMic(); break;
                            case 'b': e.preventDefault(); this.dom.sidebar.classList.toggle('hidden'); break;
                            case 'l': e.preventDefault(); this.createNewSession(); break;
                            case 's': e.preventDefault(); this.exportChat(); break;
                            case 'o': e.preventDefault(); this.dom.importFile.click(); break;
                        }
                    }
                });

                // Drag & Drop
                const dropZone = document.body;
                dropZone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.dom.dragOverlay.style.display = 'flex';
                });
                dropZone.addEventListener('dragleave', (e) => {
                    if (e.target === this.dom.dragOverlay) this.dom.dragOverlay.style.display = 'none';
                });
                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.dom.dragOverlay.style.display = 'none';
                    if (e.dataTransfer.files.length > 0) this.handleFileDrop(e.dataTransfer.files[0]);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => new AIChatApp());
    </script>
</body>
</html>
